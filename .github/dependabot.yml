version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: [/backend, /frontend, /infra]
    schedule: { interval: weekly }
    ignore:
      # Python is pinned by backend/.python-version and uv.lock (UV_PYTHON_DOWNLOADS=never): a newer base image has
      # no Python 3.13 and `uv sync` fails. Node majors follow the CI's node-version.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      base-images: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      # Pinned on purpose: npm `latest` is a beta (CLAUDE.md).
      - dependency-name: aladin-lite
    groups:
      npm-minor: { update-types: [minor, patch] }

  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      python-minor: { update-types: [minor, patch] }
