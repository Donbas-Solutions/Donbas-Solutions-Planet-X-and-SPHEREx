# Same origin for the page, /api and /files, as with the Vite dev proxy: no CORS needed.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

map $uri $cache_control {
    ~^/assets/          "public, max-age=31536000, immutable";
    ~^/(prebaked|mock)/ "public, max-age=3600";
    default             "no-cache";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    client_max_body_size 1k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml application/wasm application/octet-stream;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        limit_except GET HEAD { deny all; }
        # Job polling is 1-3 s per tab; the limit only stops floods that would hit IRSA (NFR-5).
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /files/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
