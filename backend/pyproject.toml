[project]
name = "spherex-blink-backend"
version = "0.1.0"
description = "SPHEREx Blink backend: SPHEREx cutouts -> per-visit stacks for the web viewer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=2.0",
  "astropy>=6.1",
  "astroquery>=0.4.10",
  "pyvo>=1.6",
  "reproject>=0.14",
  "photutils>=2.0",
  "pillow>=10.4",
  "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
