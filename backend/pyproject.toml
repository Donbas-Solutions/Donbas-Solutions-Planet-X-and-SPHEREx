[project]
name = "spherex-blink-backend"
version = "0.1.0"
description = "SPHEREx Blink backend: SPHEREx cutouts -> per-visit stacks for the web viewer"
requires-python = ">=3.11.5"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=2.0",
  "astropy>=6.1",
  "astroquery>=0.4.10",
  "pyvo>=1.6",
  "reproject>=0.14",
  "photutils>=2.0",
  "pillow>=10.4",
  "certifi",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.17.4",
]

[tool.uv]
# Floors for transitive dependencies with known CVEs (soupsieve < 4.0: ReDoS, via astroquery -> beautifulsoup4).
constraint-dependencies = ["soupsieve>=4.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that talk to IRSA/SIMBAD are opt-in: uv run pytest -m network
addopts = ["-m", "not network", "--strict-markers"]
markers = ["network: needs live internet access to IRSA/SIMBAD (deselected by default)"]
filterwarnings = ["error::RuntimeWarning:asyncio"] # "coroutine ... was never awaited" fails the test

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
# Untyped scientific packages: treat as Any instead of failing.
[[tool.mypy.overrides]]
module = ["astropy.*", "astroquery.*", "pyvo.*", "reproject.*", "photutils.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
